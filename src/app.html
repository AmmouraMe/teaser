<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<!-- Install metadata. Without this, "Add to Home Screen" invents a name from
		     the <title> and picks whichever icon it can find. Generated together
		     with the icons by scripts/build-icons.mjs. -->
		<link rel="manifest" href="/site.webmanifest" />
		<!-- The stored theme, applied before the first paint. Reading it in the
		     component instead means the page renders dark and then flips, which is
		     a flash of the wrong site on every reload for anyone who chose light.
		     Deliberately not prefers-color-scheme: the light theme is a choice a
		     visitor makes, not one their laptop makes for them. -->
		<script>
			try {
				var t = localStorage.getItem('ammoura-theme');
				if (t === 'light' || t === 'dark') {
					document.documentElement.dataset.theme = t;
					// Set here as well as in the page: left saying "dark" the browser
					// paints dark form controls and a dark UI tint over a pastel
					// page. Both tags are above this script, so they are already in
					// the DOM to be edited.
					var cs = document.querySelector('meta[name="color-scheme"]');
					if (cs) cs.content = t;
					var tc = document.querySelector('meta[name="theme-color"]');
					if (tc) tc.content = t === 'light' ? '#fff7fb' : '#000000';
				}
			} catch (e) {
				/* private window, or storage refused — the default theme stands */
			}
		</script>
		<style>
			/* Autofill override — must live outside Svelte scoping to beat UA !important on iOS Chrome */
			/* Themed like everything else: a light-theme email field that autofills
			   to a black box is worse than no override at all. The custom
			   properties come from the page; the fallbacks are the dark values, so
			   this still works if it somehow runs before they are set. */
			:root { --autofill-bg: #000; --autofill-fg: #fff; }
			:root[data-theme='light'] { --autofill-bg: #fff; --autofill-fg: #3a1e42; }
			@keyframes autofill-override {
				0%, 100% {
					background-color: var(--autofill-bg) !important;
					color: var(--autofill-fg) !important;
					-webkit-text-fill-color: var(--autofill-fg) !important;
				}
			}
			input:-webkit-autofill,
			input:-webkit-autofill:hover,
			input:-webkit-autofill:focus,
			input:-webkit-autofill:active,
			textarea:-webkit-autofill,
			textarea:-webkit-autofill:hover,
			textarea:-webkit-autofill:focus,
			textarea:-webkit-autofill:active,
			select:-webkit-autofill,
			select:-webkit-autofill:hover,
			select:-webkit-autofill:focus,
			select:-webkit-autofill:active {
				-webkit-text-fill-color: var(--autofill-fg) !important;
				-webkit-box-shadow: 0 0 0px 9999px var(--autofill-bg) inset !important;
				box-shadow: 0 0 0px 9999px var(--autofill-bg) inset !important;
				background-color: var(--autofill-bg) !important;
				background: var(--autofill-bg) !important;
				color: var(--autofill-fg) !important;
				caret-color: var(--autofill-fg) !important;
				-webkit-appearance: none !important;
				appearance: none !important;
				animation: autofill-override 0.01s infinite both !important;
				-webkit-animation: autofill-override 0.01s infinite both !important;
				transition: background-color 9999s ease-in-out 0s !important;
				-webkit-transition: background-color 9999s ease-in-out 0s !important;
			}
			input:-internal-autofill-selected,
			textarea:-internal-autofill-selected {
				-webkit-text-fill-color: var(--autofill-fg) !important;
				-webkit-box-shadow: 0 0 0px 9999px var(--autofill-bg) inset !important;
				box-shadow: 0 0 0px 9999px var(--autofill-bg) inset !important;
				background-color: var(--autofill-bg) !important;
				background: var(--autofill-bg) !important;
				color: var(--autofill-fg) !important;
				caret-color: var(--autofill-fg) !important;
				-webkit-appearance: none !important;
				appearance: none !important;
				animation: autofill-override 0.01s infinite both !important;
				-webkit-animation: autofill-override 0.01s infinite both !important;
			}
		</style>
		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-YW3Q11HJNK"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			gtag('config', 'G-YW3Q11HJNK');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
